name: Release Mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up PATH
      run: |
        echo "${ANDROID_HOME}/build-tools/35.0.0" >> $GITHUB_PATH
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Grant gradlew execute permission
      run: chmod +x gradlew
    - name: Build mod jar
      run: ./gradlew deploy
    - name: Upload built jar to Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*.jar
        generate_release_notes: true
    - name: Strip auto-generated Full Changelog footer
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        RELEASE_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
        RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r .id)
        CLEAN_BODY=$(echo "$RELEASE_JSON" | jq -r .body | sed '/\*\*Full Changelog\*\*/d')
        jq -n --arg body "$CLEAN_BODY" '{body: $body}' > payload.json
        curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d @payload.json \
          "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}" > /dev/null
