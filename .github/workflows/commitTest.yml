name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up PATH
      run: |
        echo "${ANDROID_HOME}/build-tools/35.0.0" >> $GITHUB_PATH
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Grant gradlew execute permission
      run: chmod +x gradlew
    - name: Build mod jar
      run: ./gradlew deploy
    - name: Upload built jar file
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}
        path: build/libs/*.jar
